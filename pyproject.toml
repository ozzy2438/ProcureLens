[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurelens"
version = "1.0.0"
description = "Federal Procurement Intelligence & Bid Agent Platform over AusTender data"
authors = [{ name = "Osman Orka" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "xgboost==3.4.0",
    "mlflow>=3.15,<4",
    "shap>=0.45",
    "evidently==0.7.21",
]
agent = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "sqlglot>=30,<31",
    "langfuse>=4.7,<5",
]
etl = [
    "dbt-postgres>=1.7",
]
ui = [
    "streamlit>=1.33,<2",
    "plotly>=5.20",
]
evals = [
    "evidently==0.7.21",
]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["procurelens"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
