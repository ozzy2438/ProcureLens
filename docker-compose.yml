services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: procurelens
      POSTGRES_PASSWORD: procurelens
      POSTGRES_DB: procurelens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/bootstrap_db.sql:/docker-entrypoint-initdb.d/bootstrap_db.sql

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://procurelens:procurelens@db:5432/procurelens
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [db, mlflow]
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    env_file: .env
    depends_on: [api]
    ports:
      - "8501:8501"

volumes:
  pgdata:
