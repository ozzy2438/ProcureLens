name: Weekly AusTender ingest

on:
  schedule:
    - cron: "0 18 * * 6"   # Sunday 04:00 AEST
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Ingest last 7 days of contract notices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m procurelens.ingestion.ocds_client --last-days 7
