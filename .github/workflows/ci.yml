name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src || true  # advisory until Week 3 hardening
      - name: Tests
        run: pytest --cov=procurelens

  eval-gate:
    # LLM eval gate: blocks merge if groundedness / SQL accuracy fall below thresholds.
    # Runs only when an API key secret is configured (skipped on forks).
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No API key configured - skipping eval gate."
            exit 0
          fi
          pip install -e ".[evals,agent]"
          python evals/run_evals.py --gate
